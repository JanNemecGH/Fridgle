<style>
/* Layout: pracovní aplikace — lepkavá hlavička se záložkami, nahoře pás „spotřebuj nejdřív“, pod ním tři sloupce úložišť (na mobilu pod sebou); nákupní seznam jako účtenka. */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --sunk:#E4EAE6; --ink:#16201B; --muted:#5B6862; --line:#D6DED9;
  --accent:#2C6A4C; --accent-ink:#FFFFFF; --accent-soft:#DDEBE2;
  --spiz:#9A6B1F; --spiz-soft:#F3E8D3;
  --led:#2A6896; --led-soft:#DEEAF4;
  --mraz:#5352B8; --mraz-soft:#E6E5F8;
  --bad:#B0372C; --bad-soft:#F7DFDB; --warn:#A86300; --warn-soft:#F9E8CC;
  --shadow:0 1px 2px rgba(22,32,27,.06),0 6px 24px rgba(22,32,27,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#18201C; --sunk:#131a17; --ink:#E3EAE6; --muted:#97A39D; --line:#28322D;
  --accent:#71C298; --accent-ink:#0D1511; --accent-soft:#1F3229;
  --spiz:#D9A953; --spiz-soft:#2E2618; --led:#7DB6E2; --led-soft:#18283A; --mraz:#A3A2F2; --mraz-soft:#24233F;
  --bad:#F08A7E; --bad-soft:#3A1F1C; --warn:#F0B35A; --warn-soft:#352813;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#18201C; --sunk:#131a17; --ink:#E3EAE6; --muted:#97A39D; --line:#28322D;
  --accent:#71C298; --accent-ink:#0D1511; --accent-soft:#1F3229;
  --spiz:#D9A953; --spiz-soft:#2E2618; --led:#7DB6E2; --led-soft:#18283A; --mraz:#A3A2F2; --mraz-soft:#24233F;
  --bad:#F08A7E; --bad-soft:#3A1F1C; --warn:#F0B35A; --warn-soft:#352813;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.brand{font:700 26px/1 var(--f-display);letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:10px}
.brand .logo svg{width:40px;height:40px;display:block}
.brand small{display:block;white-space:nowrap;font:500 12px/1.3 var(--f-body);color:var(--muted);letter-spacing:.02em;margin-top:4px}
.hrow .sp{flex:1}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.tab .cnt{font:500 11px var(--f-mono);background:var(--sunk);color:var(--muted);border-radius:999px;padding:1px 6px}
.tab[aria-selected="true"] .cnt{background:rgba(127,127,127,.3);color:inherit}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}

main{padding-block:18px 80px;display:flex;flex-direction:column;gap:22px}
h2{font:700 20px/1.2 var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font:600 13px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.07em;margin:0;color:var(--muted)}
.sechead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sechead .sp{flex:1}
.note{color:var(--muted);font-size:13px}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:14px}

/* use-first strip */
.urgent{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.urgent .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.uc{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.uc .top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.uc .nm{font-weight:600}
.uc .sub{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
.chip:hover{background:var(--accent-soft)}

/* pills */
.pill{font:500 12px/1 var(--f-mono);padding:5px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.tag.open{background:var(--warn-soft);color:var(--warn)}
.tag.ex{background:transparent;border:1px dashed var(--line)}

/* segmented filter */
.seg{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* storage columns */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.store{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.store .sh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.store .sh .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.store .sh b{font:700 17px var(--f-display)}
.store .sh .note{margin-left:auto}
.store[data-loc="spiz"] .ic{background:var(--spiz-soft);color:var(--spiz)}
.store[data-loc="lednice"] .ic{background:var(--led-soft);color:var(--led)}
.store[data-loc="mrazak"] .ic{background:var(--mraz-soft);color:var(--mraz)}
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.rli{display:flex;align-items:center;border-bottom:1px solid var(--line)}.rli:last-child{border-bottom:0}.rli .row{border-bottom:0;flex:1;min-width:0}
.take{flex:none;width:36px;height:36px;margin-right:12px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:600 20px/1 var(--f-body);color:var(--muted);display:grid;place-items:center;padding:0}
.take:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.row:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .nm{font-weight:600;overflow-wrap:anywhere}
.row .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.empty{padding:18px 16px;color:var(--muted);font-size:14px}
.empty.big{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}

/* recipes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .t{font:700 18px/1.2 var(--f-display);overflow-wrap:anywhere}
.ings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:14px}
.ings li{display:flex;gap:8px;align-items:baseline}
.ings .q{font-family:var(--f-mono);font-size:12.5px;min-width:70px;color:var(--muted)}
.ings .st{margin-left:auto;font-size:12px;font-weight:600}
.st.have{color:var(--accent)} .st.part{color:var(--warn)} .st.miss{color:var(--bad)}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}

/* plan */
.days{display:flex;flex-direction:column;gap:10px}
.day{display:grid;grid-template-columns:86px 1fr;gap:14px;align-items:start}
.day .dl{padding-top:12px}
.day .dl b{display:block;font:700 18px/1 var(--f-display)}
.day .dl span{font-size:12.5px;color:var(--muted)}
.day.today .dl b{color:var(--accent)}
.meals{display:flex;flex-direction:column;gap:8px;min-width:0}
.meal{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.meal.done{opacity:.6}
.meal .mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meal .mh .nm{font-weight:600;font-size:16px}
.addslot{border:1px dashed var(--line);background:none;border-radius:var(--r);padding:10px;color:var(--muted);font-weight:600;text-align:left}
.addslot:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:520px){.day{grid-template-columns:1fr;gap:6px}.day .dl{padding-top:0;display:flex;gap:8px;align-items:baseline}}

/* receipt shopping list */
.receipt{background:var(--surface);max-width:520px;width:100%;border-radius:4px;box-shadow:var(--shadow);font-family:var(--f-mono);font-size:14px;position:relative;padding:22px 20px 26px}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(-45deg,transparent 6px,var(--surface) 0) 0 0/12px 8px repeat-x,linear-gradient(45deg,transparent 6px,var(--surface) 0) 0 0/12px 8px repeat-x}
.receipt .rh{text-align:center;display:flex;flex-direction:column;gap:2px}
.receipt .rh b{font:700 18px var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.dash{border:0;border-top:1px dashed var(--line);margin:14px 0}
.sl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.si{display:flex;align-items:flex-start;gap:10px;padding:7px 0}
.si input{width:20px;height:20px;accent-color:var(--accent);margin-top:1px;flex:none}
.si .n{flex:1;min-width:0;overflow-wrap:anywhere}
.si .n small{display:block;color:var(--muted);font-size:11.5px}
.si .q{white-space:nowrap}
.si.done .n,.si.done .q{text-decoration:line-through;color:var(--muted)}
.si .x{border:0;background:none;color:var(--muted);padding:0 4px;font-size:18px;line-height:1}
.shopbar{display:flex;gap:8px;flex-wrap:wrap}
.addline{display:flex;gap:8px}
.addline input{flex:1;min-width:0}

/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;width:100%;color:var(--ink);font-weight:400;font-size:15px}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.qty{display:grid;grid-template-columns:1fr 90px;gap:6px}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.ov{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet{border-radius:18px}}
.sheet .shh{display:flex;align-items:center;gap:8px}
.sheet .shh h2{flex:1}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:-18px;background:var(--surface);padding-block:10px 0}
.actlist{display:flex;flex-direction:column;gap:6px}
.actlist .btn{justify-content:flex-start;padding:12px 14px}
.actlist .btn.act{gap:12px;padding:10px 12px;text-align:left;white-space:normal;border-radius:14px}
.aic{--aic-hi:var(--accent-soft);flex:none;width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.aic svg{width:26px;height:26px;display:block}
.aic svg ellipse,.aic svg rect[fill],.aic svg path[fill="currentColor"]{fill:currentColor}
.btn.act .aic{--aic-hi:var(--accent-soft)}
.btn.act:hover .aic{background:var(--accent);color:var(--accent-ink);--aic-hi:var(--accent)}
.btn.act.danger .aic{background:var(--bad-soft);color:var(--bad);--aic-hi:var(--bad-soft)}
.btn.act.danger:hover .aic{background:var(--bad);color:var(--surface);--aic-hi:var(--bad)}
.src{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);min-width:0}.src svg{width:17px;height:17px;flex:none;color:var(--accent)}.src span{overflow-wrap:anywhere}.src a{color:var(--accent)}
.rrv{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}.rrv>input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}.rrv details{flex:1;min-width:0}.rrv summary{cursor:pointer;list-style:none}.rrv summary::-webkit-details-marker{display:none}.rrv .ings{margin-top:8px}.rrv .stp{margin-top:8px;font-size:13px;color:var(--muted);white-space:pre-wrap;line-height:1.5;max-height:8em;overflow:hidden}
.dupbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px dashed var(--accent);border-radius:16px;padding:10px 14px}.dupbar .aic{width:34px;height:34px}.dupbar .aic svg{width:22px;height:22px}.dupbar .dt{font-weight:600;font-size:14px}
.dup{grid-column:1/-1;display:flex;gap:8px;align-items:flex-start;font-size:13.5px;font-weight:600;color:var(--accent);padding:2px 0 4px}.dup input{accent-color:var(--accent);width:18px;height:18px;flex:none;margin:0}.dup .note{font-weight:400}
.picks{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow-y:auto}.pick{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left}.pick:hover{border-color:var(--accent)}
.mgpair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.mgpair>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}.mgpair small{color:var(--muted);font-size:12.5px}.mgpair .plus{font:700 22px var(--f-display);color:var(--accent)}
#e-g,#e-op,#e-qg{accent-color:var(--accent);width:18px;height:18px;flex:none;margin:0}
.tag.pk{text-transform:none;letter-spacing:0;font-family:var(--f-mono);font-weight:500}
.pks{display:flex;flex-direction:column;gap:6px}.pkrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:8px 10px}.pkrow .take{margin:0;width:32px;height:32px}.pkrow .sp{flex:1}
.pkq{display:flex;flex-direction:column;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);min-width:0}.pkq input{min-width:0}
.pkedit{display:grid;grid-template-columns:96px 96px auto 1fr 32px;align-items:end;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}.pkedit .qty{display:flex;gap:6px;align-items:center}.pkedit .qty input{min-width:0}.pko{display:flex;gap:6px;align-items:center;font-size:13.5px;white-space:nowrap}.pko input{accent-color:var(--accent);width:18px;height:18px;margin:0}
@media (max-width:560px){.pkedit{grid-template-columns:1fr 1fr 32px}.pkedit .pko{grid-column:1}.pkedit [data-f=bb]{grid-column:2/4}.pkedit [data-rmp]{grid-column:3;grid-row:1}}
.catf{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:-8px;padding-bottom:2px}.catf::-webkit-scrollbar{display:none}
.cchip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;white-space:nowrap;display:flex;gap:6px;align-items:baseline}.cchip .mono{color:var(--muted);font-size:11.5px}.cchip:hover{border-color:var(--accent)}
.cchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.cchip[aria-pressed="true"] .mono{color:inherit;opacity:.8}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.srch{flex:1 1 240px;position:relative;display:flex;align-items:center;min-width:0}.srch svg{position:absolute;left:11px;width:18px;height:18px;color:var(--muted);pointer-events:none}.srch input{padding-left:36px;width:100%;border-radius:12px}
.seglab{align-self:center;font-size:12.5px;font-weight:600;color:var(--muted);padding:0 4px 0 6px}
.rows .grp{display:flex;justify-content:space-between;padding:8px 16px 5px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--sunk);border-bottom:1px solid var(--line)}
.sl .grp{display:flex;justify-content:space-between;padding:12px 0 2px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px dashed var(--line)}
.ghead{grid-column:1/-1;margin:6px 0 -4px;display:flex;gap:8px;align-items:baseline}
.al{display:flex;flex-direction:column;gap:2px;min-width:0}
.al b{font-weight:600;font-size:15px;color:var(--ink)}
.btn.act.danger .al b{color:var(--bad)}
.al small{font-weight:400;font-size:13px;color:var(--muted);line-height:1.35}

.rev{display:flex;flex-direction:column;gap:8px}
.pk{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0;white-space:nowrap}.pk input{min-width:0}
.revrow{display:grid;grid-template-columns:1fr 74px 64px 128px 104px 132px 32px;gap:6px;align-items:center}
.revrow input,.revrow select{padding:6px 8px;font-size:14px}
@media (max-width:640px){.revrow{grid-template-columns:1fr 1fr 1fr;border-bottom:1px dashed var(--line);padding-bottom:8px}.revrow .nmi{grid-column:1/-1}}
.drow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.drow .from{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.drow .from input{width:80px;padding:4px 6px}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.subtabs button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:min(92vw,520px);box-shadow:var(--shadow)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.sync{border:0;background:var(--sunk);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.sync.ok{background:var(--accent-soft);color:var(--accent)}.sync.err{background:var(--bad-soft);color:var(--bad)}.sync.busy{color:var(--warn);background:var(--warn-soft)}

function expiryP(it,p){let x=p.bb||it.bestBefore||'9999-12-31';if(p.opened&&p.openedAt&&it.openDays!=null){const o=addDays(p.openedAt,it.openDays);if(o<x)x=o}return x}
function daysLeft(it){return diffDays(expiry(it),today())}
function status(n){return n<=1?'bad':n<=3?'warn':n<=7?'':'ok'}
const fmtIt=it=>(it.qtyGuess?'≈ ':'')+fmtQty(it.qty,it.unit);
const r3=x=>Math.round(x*1000)/1000;
/* ---------- balení: jedna položka, víc samostatných balení {q, opened, openedAt, bb} ---------- */
const partOf=p=>!!(p&&p.s>p.q+1e-6);
function getPacks(it){if(Array.isArray(it.packs)&&(it.packs.length>1||(it.packs.length===1&&partOf(it.packs[0]))))return it.packs;
  if(it.packSize&&it.qty>it.packSize+1e-6){const n=Math.floor(it.qty/it.packSize+1e-9);const a=Array.from({length:n},()=>({q:it.packSize}));const rest=r3(it.qty-n*it.packSize);if(rest>1e-6)a.push({q:rest});if(it.opened)a[a.length-1]={...a[a.length-1],opened:true,openedAt:it.openedAt};return a}
  return null}
function packList(total,spec){if(Array.isArray(spec)){const a=spec.map(Number).filter(x=>x>0);return a.length>1?a:null}
  const s=String(spec??'').replace(/\s/g,'').replace(/,/g,'.');if(!s)return null;
  if(s.includes('+')){const a=s.split('+').map(Number).filter(x=>x>0);return a.length>1?a:null}
  const m=s.match(/^(\d+)[x×*](\d+(?:\.\d+)?)$/i);if(m){const n=+m[1],q=+m[2];return n>1&&q>0?Array(n).fill(q):null}
  const size=+s;if(!(size>0)||!(total>size+1e-6))return null;const n=Math.floor(total/size+1e-9);const a=Array(n).fill(size);const rest=r3(total-n*size);if(rest>1e-6)a.push(rest);return a}
function packSpec(ps){if(!ps)return'';const qs=ps.map(p=>typeof p==='number'?p:p.q);return qs.every(q=>q===qs[0])?`${qs.length}x${qs[0]}`:qs.join('+')}
const fmtPk=(p,u)=>partOf(p)?`${num(p.q)} z ${fmtQty(p.s,u)}`:fmtQty(p.q,u);
function fmtPacks(it,ps){const g=[];for(const p of ps){const k=p.q+'|'+(p.s||'')+'|'+!!p.opened;const last=g[g.length-1];if(last&&last.k===k)last.n++;else g.push({k,n:1,p})}return g.map(x=>`${x.n>1?x.n+'× ':''}${fmtPk(x.p,it.unit)}${x.p.opened?(it.loc==='mrazak'?' načaté':' otevř.'):''}`).join(' + ')}
function packsPatch(it,packs){packs=packs.filter(p=>p.q>1e-6).map(p=>{const o={q:r3(p.q),s:r3(Math.max(+p.s||0,p.q))};if(p.opened){o.opened=true;o.openedAt=p.openedAt||today()}if(p.bb&&p.bb!==it.bestBefore)o.bb=p.bb;return o});if(!packs.length)return null;
  if(packs.length===1&&!partOf(packs[0])){const p=packs[0];return{qty:p.q,packs:null,packSize:null,opened:!!p.opened,openedAt:p.opened?p.openedAt:null,bestBefore:p.bb||it.bestBefore}}
  const op=packs.filter(p=>p.opened).map(p=>p.openedAt).sort();return{qty:r3(packs.reduce((a,p)=>a+p.q,0)),packs,packSize:null,opened:op.length>0,openedAt:op[0]||null}}
async function savePacks(it,packs,extra={}){packs=packs.filter(p=>p.q>1e-6);if(!packs.length){await del('items',it.id);return}
  const e=kbFind(it.name)||{};const od=it.openDays??e.open??3;const opened=packs.filter(p=>p.opened);
  if(opened.length&&e.openLoc&&it.loc==='spiz'&&opened.length===packs.length){await patch('items',it.id,{...packsPatch(it,packs),loc:e.openLoc,openDays:od,...extra});return}
  const p=packsPatch(it,packs);if(p.opened)p.openDays=od;await patch('items',it.id,{...p,...extra})}
function planTake(it,take,idx){const out=getPacks(it).map(p=>({...p,s:p.s||p.q}));let rem=take;const od=it.openDays??kbFind(it.name)?.open;
  const order=idx!=null?[idx]:out.map((_,i)=>i).sort((a,b)=>(!!out[b].opened-!!out[a].opened)||(expiryP(it,out[a])<expiryP(it,out[b])?-1:expiryP(it,out[a])>expiryP(it,out[b])?1:0)||(out[a].q-out[b].q));
  for(const i of order){if(rem<=1e-9)break;const t=Math.min(rem,out[i].q);out[i].q=r3(out[i].q-t);rem=r3(rem-t);if(out[i].q>1e-6&&!out[i].opened&&od!=null&&it.loc!=='mrazak'){out[i].opened=true;out[i].openedAt=today();out[i].fresh=true}}
  return out}
function openPatch(it){const e=kbFind(it.name)||{};const od=it.openDays??e.open??3;const p={opened:true,openedAt:today(),openDays:od};if(e.openLoc&&it.loc==='spiz')p.loc=e.openLoc;return p}
function shouldAutoOpen(it,left){if(it.opened||it.loc==='mrazak')return false;const e=kbFind(it.name)||{};const od=it.openDays??e.open;if(od==null)return false;if(it.packSize&&Math.abs(left/it.packSize-Math.round(left/it.packSize))<1e-6)return false;if(e.piece)return it.unit==='ks'&&Math.abs(left-Math.round(left))>1e-6;if(it.unit==='ks'&&Math.abs(left-Math.round(left))<1e-6)return false;return true}

try{const t=localStorage.getItem('sp-tab');if(t)S.tab=t;const l=localStorage.getItem('sp-loc');if(l)S.loc=l;S.sort=JSON.parse(localStorage.getItem('sp-sort')||'{}')||{};S.cat=localStorage.getItem('sp-cat')||''}catch(e){}

function canon(o){if(Array.isArray(o))return'['+o.map(canon).join(',')+']';if(o&&typeof o==='object')return'{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+canon(o[k])).join(',')+'}';return JSON.stringify(o)}

function merge(a,b){const out={};COLS.forEach(c=>{out[c]={...((a&&a[c])||{})};for(const[id,r]of Object.entries((b&&b[c])||{})){const cur=out[c][id];if(r&&(!cur||(r.u||0)>(cur.u||0)))out[c][id]=r}});const lim=Date.now()-60*864e5;COLS.forEach(c=>{for(const[id,r]of Object.entries(out[c]))if(r.del&&r.u<lim)delete out[c][id]});return out}

const connected=()=>!!(CFG.token&&CFG.gist);
async function gh(path,opts={}){const r=await fetch('https://api.github.com'+path,{...opts,cache:'no-store',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+CFG.token,...(opts.body?{'Content-Type':'application/json'}:{})}});if(!r.ok){const e=new Error('GitHub '+r.status);e.status=r.status;throw e}return r.json()}
const payload=d=>JSON.stringify({format:'spizirna-data',version:1,saved:new Date().toISOString(),data:d});
async function pull(){const g=await gh('/gists/'+CFG.gist);const f=g.files&&g.files[FILE];if(!f)return null;let txt=f.content;if(f.truncated){txt=await(await fetch(f.raw_url,{cache:'no-store'})).text()}try{return JSON.parse(txt)}catch(e){return null}}
let pushT=null,syncing=false,again=false;
function schedulePush(){if(!connected())return;SYNC.state='dirty';renderSync();clearTimeout(pushT);pushT=setTimeout(sync,1500)}
async function sync(){
  if(!connected())return;if(syncing){again=true;return}
  syncing=true;clearTimeout(pushT);SYNC={state:'busy',msg:''};renderSync();
  try{
    const remote=await pull();const rdata=remote&&remote.data||{};
    const merged=merge(DATA,rdata);
    if(canon(merged)!==canon(DATA)){DATA=merged;lsSet(LS,DATA);refresh();render()}
    if(canon(merged)!==canon(merge({},rdata)))await gh('/gists/'+CFG.gist,{method:'PATCH',body:JSON.stringify({files:{[FILE]:{content:payload(merged)}}})});
    CFG.lastSync=new Date().toISOString();lsSet(LSCFG,CFG);SYNC={state:'ok',msg:''};
  }catch(e){SYNC={state:'err',msg:e.status===401?'Token je neplatný nebo vypršel.':e.status===404?'Gist se nenašel. Zkontroluj ID gistu a že token má oprávnění „gist“.':navigator.onLine===false?'Jsi offline. Změny jsou uložené v zařízení a odešlou se po připojení.':'Synchronizace selhala, zkusím to znovu.'}}
  syncing=false;renderSync();if(again){again=false;sync()}
}

function boot(){
  const c=lsGet(LSCFG);if(c)CFG={...CFG,...c};

  const isRecArr=Array.isArray(j)&&j.some(x=>x&&x.ingredients);
  const arr=isRecArr?[]:Array.isArray(j)?j:(j.items||[]);const U=['g','ml','ks','porce'];const D=/^\d{4}-\d\d-\d\d$/;
  const items=arr.filter(x=>x&&x.name).map(x=>newItem({name:String(x.name),qty:+x.qty||1,unit:U.includes(x.unit)?x.unit:undefined,loc:LOCS[x.loc]?x.loc:undefined,days:x.days!=null&&!isNaN(+x.days)?+x.days:undefined,bestBefore:D.test(x.bestBefore||'')?x.bestBefore:undefined,openDays:x.openDays===undefined?undefined:(x.openDays==null?null:+x.openDays),packSize:+x.pack||+x.packSize||null,packs:Array.isArray(x.packs)?x.packs:undefined,qtyGuess:!!x.qtyGuess}));
  const noQ=g=>g.qty==null||g.qty===''||isNaN(+g.qty)||+g.qty<=0;
  const recs=(isRecArr?j:Array.isArray(j)?[]:(j.recipes||[])).filter(r=>r&&r.name).map(r=>({name:String(r.name).trim(),servings:Math.max(1,Math.round(+r.servings)||2),source:r.source?String(r.source).trim():'',page:r.page!=null&&r.page!==''?String(r.page).trim():'',ingredients:(r.ingredients||[]).filter(g=>g&&g.name).map(g=>noQ(g)?{name:String(g.name),qty:null,unit:''}:{name:String(g.name),qty:+g.qty,unit:U.includes(g.unit)?g.unit:'ks'}),steps:Array.isArray(r.steps)?r.steps.map(String).join('\n'):String(r.steps||'')}));
  if(recs.length){recipeReviewSheet(recs,items.length?()=>reviewSheet(items):null);return}
  if(items.length)reviewSheet(items);else{if(st)st.textContent='V souboru nejsou žádné položky ani recepty.';else toast('V souboru nejsou žádné položky ani recepty.')}

/* ---------- derived ---------- */
const recipe=id=>S.recipes.find(r=>r.id===id);
function haveFor(ingName,unit,excludeFrozen){let sum=0;for(const it of S.items){if(excludeFrozen&&it.loc==='mrazak')continue;if(!matches(it.name,ingName))continue;const c=conv(it.qty,it.unit,unit,it.name)??conv(it.qty,it.unit,unit,ingName);if(c!=null)sum+=c}return sum}
function recipeAvail(r,servings){const f=(servings||r.servings)/(r.servings||1);const rows=(r.ingredients||[]).map(g=>{if(g.qty==null)return{...g,need:null,have:0,st:'taste'};const need=g.qty*f,have=haveFor(g.name,g.unit);return{...g,need,have,st:have>=need-1e-6?'have':have>0?'part':'miss'}});const real=rows.filter(x=>x.st!=='taste');const ok=real.filter(x=>x.st==='have').length;return{rows,ratio:real.length?ok/real.length:0,ok,total:real.length}}
function srcText(r){return[r.source,r.page?'str. '+r.page:''].filter(Boolean).join(', ')}
function srcHtml(r){if(/^https?:\/\//i.test(r.source||'')){let host=r.source;try{host=new URL(r.source).hostname.replace(/^www\./,'')}catch(e){}return`<a href="${h(r.source)}" target="_blank" rel="noopener">${h(host)}</a>${r.page?', str. '+h(r.page):''}`}return h(srcText(r))}
const srcLine=r=>r.source||r.page?`<div class="src">${AIC.book}<span>${srcHtml(r)}</span></div>`:'';
const qtyTxt=(q,u)=>q==null?'dle chuti':fmtQty(q,u);
function urgentItems(){return S.items.map(it=>({it,d:daysLeft(it)})).filter(({it,d})=>it.loc==='mrazak'?d<=7:(d<=3||it.opened)).sort((a,b)=>a.d-b.d)}
function recipesUsing(it){return S.recipes.filter(r=>(r.ingredients||[]).some(g=>matches(it.name,g.name)))}

function loading(c){return false}

function itemRow(it){

/* ---------- řazení, skupiny, hledání ---------- */
const CATS=['Maso','Ryby','Uzeniny','Mléčné','Zelenina','Ovoce','Bylinky','Pečivo','Trvanlivé','Konzervy','Omáčky','Koření','Sladké','Nápoje','Hotové jídlo','Ostatní'];
const catOf=it=>(it.cat&&it.cat!=='Ostatní')?it.cat:(kbFind(it.name)?.cat||it.cat||'Ostatní');
const catIdx=c=>{const i=CATS.indexOf(c);return i<0?CATS.length-1:i};
function qMatch(q,...fields){const t=norm(q).split(' ').filter(Boolean);if(!t.length)return true;const hay=' '+norm(fields.join(' '));return t.every(x=>hay.includes(x))}
const SORTS={zasoby:[['exp','Trvanlivost'],['abc','A–Z'],['cat','Skupiny']],recepty:[['avail','Co uvařím'],['abc','A–Z'],['src','Podle zdroje']],nakup:[['added','Jak přibývaly'],['cat','Podle oddělení'],['abc','A–Z']]};
const sortOf=k=>(S.sort&&S.sort[k])||SORTS[k][0][0];
const qOf=k=>(S.q&&S.q[k])||'';
const SRCH_IC='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/></svg>';
function toolsHtml(k,ph){return`<div class="tools">${ph?`<label class="srch">${SRCH_IC}<input type="search" id="q-${k}" data-q="${k}" value="${h(qOf(k))}" placeholder="${ph}" autocomplete="off" aria-label="${ph}"></label>`:''}<div class="seg" role="group" aria-label="Řazení"><span class="seglab">Řadit:</span>${SORTS[k].map(([v,l])=>`<button aria-pressed="${sortOf(k)===v}" data-act="sort" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div></div>`}
function sortItems(arr,mode){const byExp=(a,b)=>expiry(a)<expiry(b)?-1:expiry(a)>expiry(b)?1:a.name.localeCompare(b.name,'cs');
  if(mode==='abc')return arr.sort((a,b)=>a.name.localeCompare(b.name,'cs'));
  if(mode==='cat')return arr.sort((a,b)=>catIdx(catOf(a))-catIdx(catOf(b))||catOf(a).localeCompare(catOf(b),'cs')||byExp(a,b));
  return arr.sort(byExp)}
function withGroups(arr,keyFn,rowFn){let out='',last=null;for(const x of arr){const k=keyFn(x);if(k!==last){const n=arr.filter(y=>keyFn(y)===k).length;out+=`<li class="grp"><span>${h(k)}</span><span class="mono">${n}</span></li>`;last=k}out+=rowFn(x)}return out}

  if(!S.items.length){return html+`<div class="empty big"><b style="font:700 18px var(--f-display)">Zatím tu nic není</b><span>Po nákupu přidej položky ručně, vlož seznam textem nebo nahraj soubor vytvořený z účtenky. Trvanlivost doplním podle typu potraviny a můžeš ji kdykoli přepsat.</span><button class="btn pri" data-act="add-open">+ Přidat nákup</button></div>`}

  if(searching&&!cols.some(c=>c.arr.length))return html+(norm(q)?`<div class="empty big">Nic jsem nenašel pro „${h(q)}“${fc?` ve skupině ${h(fc)}`:''}.${fc?'<button class="btn ghost" data-act="catf" data-v="">Hledat ve všech skupinách</button>':''}<button class="btn" data-act="add-named">+ Přidat „${h(q)}“ do zásob</button></div>`:`<div class="empty big">Ve skupině ${h(fc)} tady nic není.</div>`);

}

/* ---------- duplicity a slučování ---------- */
const DSTOP=new Set(['bio','cerstv','chlazen','balen','kus','ks','velk','mal']);
function dstem(t){if(t.length<=3)return t;return t.replace(/(ovych|ich|ych|ach|ami|emi|ovy|ova|ove|ou|em|ym|im|ho|mu|i|y|a|e|o|u)$/,'')}
function dtokens(n){return norm(n).split(/[^a-z0-9]+/).filter(x=>x&&!/^\d/.test(x)).map(dstem).filter(x=>x.length>=2&&!DSTOP.has(x))}
const dtm=(a,b)=>a===b||(Math.min(a.length,b.length)>=3&&(a.startsWith(b)||b.startsWith(a)));
function similar(a,b){if(norm(a)===norm(b))return 1;const ia=kbIdx(a),ib=kbIdx(b);if(ia>=0&&ib>=0&&ia!==ib)return 0;let A=dtokens(a),B=dtokens(b);if(!A.length||!B.length)return 0;if(A.length>B.length)[A,B]=[B,A];const hit=A.filter(x=>B.some(y=>dtm(x,y))).length;return hit<A.length?0:hit/B.length}
const keptApart=(a,b)=>(a.keepSep||[]).includes(b.id)||(b.keepSep||[]).includes(a.id);
const toUnit=(q,from,to,a,b)=>conv(q,from,to,a)??conv(q,from,to,b);
function dupFor(it,excludeId){let best=null,bs=0;for(const x of S.items){if(x.id===excludeId||x.loc!==it.loc)continue;if(toUnit(1,it.unit,x.unit,x.name,it.name)==null)continue;const sc=similar(it.name,x.name);if(sc>bs||(sc>0&&sc===bs&&best.opened&&!x.opened)){bs=sc;best=x}}return best}
function dupPairs(){const out=[];const its=S.items;for(let i=0;i<its.length;i++)for(let j=i+1;j<its.length;j++){const a=its[i],b=its[j];if(a.loc!==b.loc||keptApart(a,b))continue;if(similar(a.name,b.name)>0)out.push([a,b])}return out}
function mergedOpen(a,b){const o=[a,b].filter(x=>x.opened&&x.openedAt).sort((x,y)=>x.openedAt<y.openedAt?-1:1)[0];return o?{opened:true,openedAt:o.openedAt,openDays:o.openDays??a.openDays??b.openDays}:{}}
const addsPack=(t,add)=>t.unit!=='ks'&&t.unit!=='porce'&&!!(getPacks(t)||getPacks(add)||(t.openDays??kbFind(t.name)?.open)!=null);
function addPatch(t,add){const q=toUnit(add.qty,add.unit,t.unit,t.name,add.name);if(q==null)return null;
  if(addsPack(t,add)){const f=q/(add.qty||1);const base=getPacks(t)||[{q:t.qty,...(t.opened?{opened:true,openedAt:t.openedAt}:{})}];const bbA=add.bestBefore&&add.bestBefore!==t.bestBefore?add.bestBefore:null;
    const more=(getPacks(add)||[{q:add.qty}]).map(p=>({q:r3(p.q*f),...(bbA?{bb:bbA}:{})}));const pp=packsPatch(t,[...base,...more]);if(pp.opened)pp.openDays=t.openDays??kbFind(t.name)?.open??3;return{...pp,qtyGuess:!!(t.qtyGuess||add.qtyGuess)}}const p={qty:Math.round((t.qty+q)*1000)/1000,qtyGuess:!!(t.qtyGuess||add.qtyGuess)};const bb=[t.bestBefore,add.bestBefore].filter(Boolean).sort()[0];if(bb){p.bestBefore=bb;p.guess=!!(bb===t.bestBefore?t.guess:add.guess)}Object.assign(p,mergedOpen(t,add));return p}
function dupLine(c,keep){const asP=addsPack(c,{});const on=keep&&keep.id===c.id?keep.on:(asP||!c.opened);return`<label class="dup"><input type="checkbox" data-k="merge" value="${h(c.id)}" ${on?'checked':''}><span>${asP?'Přidat jako další balení k':'Přičíst k'} „${h(c.name)}“ <span class="note">— máš ${fmtQty(c.qty,c.unit)}${c.opened?', otevřené':''}, do ${fmtDate(expiry(c))}</span></span></label>`}

function mergeSheet(id,otherId){
  const X=S.items.find(x=>x.id===id);if(!X)return;
  if(!otherId){
    const cands=S.items.filter(x=>x.id!==id).map(x=>({x,sc:similar(X.name,x.name)})).sort((a,b)=>(b.sc>0)-(a.sc>0)||(b.x.loc===X.loc)-(a.x.loc===X.loc)||b.sc-a.sc||a.x.name.localeCompare(b.x.name,'cs'));
    openSheet('Sloučit „'+X.name+'“ s…',`<div class="note">Vyber položku, která je totéž. Množství se sečte do jedné.</div><input type="text" id="mg-q" placeholder="Hledat…" autocomplete="off"><div class="picks" id="mg-l">${cands.map(({x,sc})=>`<button class="pick" data-pick="${h(x.id)}" data-n="${h(norm(x.name))}"><span class="al"><b>${h(x.name)}</b><small>${LOCS[x.loc]} · ${fmtQty(x.qty,x.unit)} · do ${fmtDate(expiry(x))}</small></span>${sc>0?'<span class="tag ok">podobné</span>':''}</button>`).join('')}</div>`,'',()=>{
      $('#mg-q').addEventListener('input',e=>{const q=norm(e.target.value);document.querySelectorAll('#mg-l .pick').forEach(b=>b.hidden=!!q&&!b.dataset.n.includes(q))});
      document.querySelectorAll('#mg-l .pick').forEach(b=>b.onclick=()=>mergeSheet(id,b.dataset.pick));
    });return}
  const Y=S.items.find(x=>x.id===otherId);if(!Y)return;
  const dates=[X.bestBefore,Y.bestBefore].filter(Boolean).sort();const op=mergedOpen(X,Y);
  openSheet('Sloučit položky',`<div class="mgpair"><div><b>${h(X.name)}</b><small>${LOCS[X.loc]} · ${fmtQty(X.qty,X.unit)} · do ${fmtDate(expiry(X))}${X.opened?' · otevřené':''}</small></div><span class="plus">+</span><div><b>${h(Y.name)}</b><small>${LOCS[Y.loc]} · ${fmtQty(Y.qty,Y.unit)} · do ${fmtDate(expiry(Y))}${Y.opened?' · otevřené':''}</small></div></div>
  <label class="f">Název sloučené položky<input type="text" id="mg-n" value="${h(Y.name)}" autocomplete="off"></label>
  <div class="chips">${[...new Set([X.name,Y.name])].map(n=>`<button class="chip" data-nm="${h(n)}">${h(n)}</button>`).join('')}</div>
  <div class="fgrid"><label class="f">Celkem<span class="qty"><input type="number" id="mg-q2" step="any" min="0"><select id="mg-u">${['g','ml','ks','porce'].map(u=>`<option ${u===Y.unit?'selected':''}>${u}</option>`).join('')}</select></span></label>
  <label class="f">Umístění<select id="mg-l2">${Object.entries(LOCS).map(([k,v])=>`<option value="${k}" ${k===Y.loc?'selected':''}>${v}</option>`).join('')}</select></label>
  <label class="f">Spotřebovat do<input type="date" id="mg-d" value="${dates[0]||''}"></label></div>
  ${dates.length===2&&dates[0]!==dates[1]?`<div class="chips"><button class="chip" data-dt="${dates[0]}">kratší ${fmtDate(dates[0])}</button><button class="chip" data-dt="${dates[1]}">delší ${fmtDate(dates[1])}</button></div>`:''}
  <div class="note" id="mg-w"></div>
  ${op.opened?`<div class="note">Sloučená položka bude vedená jako otevřená od ${fmtDate(op.openedAt)}.</div>`:''}`,
  `<button class="btn ghost" id="mg-sep">Nechat odděleně</button><span style="flex:1"></span><button class="btn" data-act="close">Zrušit</button><button class="btn pri" id="mg-ok">Sloučit</button>`,()=>{
    const calc=()=>{const u=$('#mg-u').value;const a=toUnit(X.qty,X.unit,u,X.name,Y.name),b=toUnit(Y.qty,Y.unit,u,Y.name,X.name);
      if(a==null||b==null){$('#mg-w').innerHTML=`Nedokážu převést ${a==null?fmtQty(X.qty,X.unit):fmtQty(Y.qty,Y.unit)} na ${u} — zadej celkové množství ručně.`;$('#mg-q2').value=(a??0)+(b??0)||''}
      else{$('#mg-w').textContent='';$('#mg-q2').value=Math.round((a+b)*1000)/1000}};
    $('#mg-u').addEventListener('change',calc);calc();
    document.querySelectorAll('[data-nm]').forEach(b=>b.onclick=()=>{$('#mg-n').value=b.dataset.nm});
    document.querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>{$('#mg-d').value=b.dataset.dt});
    $('#mg-sep').onclick=async()=>{closeSheet();await patch('items',X.id,{keepSep:[...new Set([...(X.keepSep||[]),Y.id])]});toast('Dobře, nechám je odděleně.')};
    $('#mg-ok').onclick=async()=>{const qty=+$('#mg-q2').value;if(!(qty>0)){toast('Zadej celkové množství.');return}
      const loc=$('#mg-l2').value;const p={name:$('#mg-n').value.trim()||Y.name,qty,unit:$('#mg-u').value,loc,bestBefore:$('#mg-d').value||dates[0]||Y.bestBefore,packs:null,packSize:null,guess:false,qtyGuess:!!(X.qtyGuess||Y.qtyGuess),example:!!(X.example&&Y.example),keepSep:[...new Set([...(X.keepSep||[]),...(Y.keepSep||[])])].filter(k=>k!==X.id&&k!==Y.id),...mergedOpen(X,Y)};
      {const PX=getPacks(X),PY=getPacks(Y);if(PX||PY){const cv=(it,ps)=>(ps||[{q:it.qty,...(it.opened?{opened:true,openedAt:it.openedAt}:{})}]).map(k=>({...k,q:toUnit(k.q,it.unit,p.unit,it.name,Y.name)??k.q,bb:k.bb||it.bestBefore}));Object.assign(p,packsPatch(p,[...cv(Y,PY),...cv(X,PX)]))}}
      if(loc==='mrazak')p.frozenAt=[X.frozenAt,Y.frozenAt].filter(Boolean).sort()[0]||today();else p.frozenAt=null;
      closeSheet();await patch('items',Y.id,p);await del('items',X.id);toast(`Sloučeno: ${p.name} — ${fmtQty(qty,p.unit)}`)};
  });
}

function itemSheet(id){

    ${canOpen?actBtn('open',id,'open','Otevřít / rozkrojit',`zkrátí trvanlivost na ${od} ${plural(od,'den','dny','dní')}${e.openLoc&&it.loc==='spiz'?' a přesune do lednice':''}`):''}

function packsSheet(id){const it=S.items.find(x=>x.id===id);if(!it)return;
  const ps=getPacks(it)||[{q:it.qty,...(it.opened?{opened:true,openedAt:it.openedAt}:{}),bb:it.bestBefore},{q:''}];
  const row=p=>`<div class="pkedit" data-r><label class="pkq"><span>zbývá (${it.unit})</span><input type="number" step="any" min="0" value="${p.q}" data-f="q" aria-label="Kolik v balení zbývá"></label><label class="pkq"><span>z balení (${it.unit})</span><input type="number" step="any" min="0" value="${p.s&&p.s!==p.q?p.s:p.q}" data-f="s" aria-label="Velikost celého balení"></label><label class="pko"><input type="checkbox" data-f="o" ${p.opened?'checked':''}> ${it.loc==='mrazak'?'načaté':'otevřené'}</label><input type="date" value="${p.bb||it.bestBefore||''}" data-f="bb" aria-label="Spotřebovat do"><input type="hidden" data-f="oa" value="${p.openedAt||''}"><button class="btn ghost sm" data-rmp aria-label="Odebrat balení">×</button></div>`;
  openSheet('Balení: '+it.name,`<div class="note">U každého balení nastav, kolik v něm zbývá a jak velké je celé balení, jestli je otevřené a do kdy ho spotřebovat. Celkové množství je součet toho, co zbývá.</div><div id="pk-l">${ps.map(row).join('')}</div><button class="btn sm" id="pk-add" style="align-self:flex-start">+ Přidat balení</button><div class="note" id="pk-sum"></div>`,`<button class="btn" data-act="close">Zrušit</button><button class="btn pri" id="pk-ok">Uložit</button>`,()=>{
    const rs=()=>[...document.querySelectorAll('#pk-l [data-r]')];

    $('#r-ok').onclick=async()=>{const rows=[...document.querySelectorAll('.revrow')];closeSheet();const pend={};let added=0,merged=0;for(const r of rows){const base=items[+r.dataset.i];const g=k=>r.querySelector(`[data-k=${k}]`).value;const it={...base,name:g('name').trim()||base.name,qty:+g('qty')||base.qty,unit:g('unit'),loc:g('loc'),bestBefore:g('bestBefore')||base.bestBefore,guess:g('bestBefore')&&g('bestBefore')!==base.bestBefore?false:!!base.guess,packs:null,packSize:null};{const list=packList(it.qty,g('pack'));if(list){it.packs=list.map(q=>({q}));it.qty=r3(list.reduce((a,b)=>a+b,0))}}if(it.loc==='mrazak')it.frozenAt=today();
      const m=r.querySelector('[data-k=merge]');if(m&&m.checked){const t=pend[m.value]||S.items.find(x=>x.id===m.value);const pp=t&&addPatch(t,it);if(pp){pend[t.id]={...t,...pp};await patch('items',t.id,pp);merged++;continue}}
      await put('items',it);added++}toast(merged?`Přidáno ${added}, přičteno ke stávajícím ${merged}`:`Přidáno ${added} ${plural(added,'položka','položky','položek')}`);S.tab='zasoby';render();for(const sid of shopIds)await del('shop',sid)};
  });
}

/* recipes */
function recipeEditSheet(id){
  const r=id?recipe(id):{name:'',servings:2,ingredients:[],steps:'',source:'',page:''};
  const srcs=[...new Set(S.recipes.map(x=>(x.source||'').trim()).filter(Boolean))];
  openSheet(id?'Upravit recept':'Nový recept',`<label class="f">Název<input type="text" id="r-n" value="${h(r.name)}" autocomplete="off"></label>
  <div class="fgrid" style="grid-template-columns:110px 1fr 90px"><label class="f">Porcí<input type="number" id="r-s" min="1" step="1" value="${r.servings}"></label><label class="f">Zdroj (kuchařka, web…)<input type="text" id="r-src" list="r-srcs" value="${h(r.source||'')}" autocomplete="off" placeholder="např. Jamie Oliver – 5 ingrediencí"></label><label class="f">Strana<input type="text" id="r-pg" value="${h(r.page||'')}" autocomplete="off"></label></div><datalist id="r-srcs">${srcs.map(x=>`<option value="${h(x)}">`).join('')}</datalist>
  <label class="f">Suroviny — jedna na řádek, množství na uvedený počet porcí; bez množství = dle chuti<textarea id="r-i" placeholder="200 g bílé zelí&#10;1 ks cibule&#10;2 lžíce olivového oleje&#10;sůl">${h((r.ingredients||[]).map(g=>g.qty==null?g.name:`${num(g.qty).replace(/\s/g,'')} ${g.unit} ${g.name}`).join('\n'))}</textarea></label>
  <div class="note" id="r-prev"></div>
  <label class="f">Postup<textarea id="r-p">${h(r.steps||'')}</textarea></label>`,`${id?`<button class="btn danger ghost" id="r-del">Smazat recept</button><span style="flex:1"></span>`:''}<button class="btn" data-act="close">Zrušit</button><button class="btn pri" id="r-ok">Uložit</button>`,()=>{
    const prev=()=>{const g=parseList($('#r-i').value,{recipe:true});$('#r-prev').innerHTML=g.length?'Rozpoznáno: '+g.map(x=>`<span class="mono">${qtyTxt(x.qty,x.unit)}</span> ${h(x.name)}`).join(' · '):''};
    $('#r-i').addEventListener('input',prev);prev();
    let armed=false;const db_=$('#r-del');if(db_)db_.onclick=async()=>{if(!armed){armed=true;db_.textContent='Opravdu smazat?';return}closeSheet();await del('recipes',id);toast('Recept smazán')};
    $('#r-ok').onclick=async()=>{const name=$('#r-n').value.trim();if(!name){toast('Recept potřebuje název.');return}const data={...(id?r:{}),name,servings:Math.max(1,+$('#r-s').value||1),ingredients:parseList($('#r-i').value,{recipe:true}),steps:$('#r-p').value,source:$('#r-src').value.trim(),page:$('#r-pg').value.trim(),example:false};closeSheet();await put('recipes',data);toast('Recept uložen')};
  });
}
function recipeView(id){const r=recipe(id);if(!r)return;openSheet(r.name,`${srcLine(r)}<div class="note">${r.servings} ${plural(r.servings,'porce','porce','porcí')}</div><ul class="ings">${(r.ingredients||[]).map(g=>`<li><span class="q">${qtyTxt(g.qty,g.unit)}</span><span>${h(g.name)}</span></li>`).join('')}</ul><div style="white-space:pre-wrap;line-height:1.6">${h(r.steps||'Postup zatím chybí.')}</div>`,`<button class="btn" data-act="recipe-edit" data-id="${h(id)}">Upravit</button><button class="btn pri" data-act="plan-new" data-r="${h(id)}">Naplánovat</button>`)}

/* plan */
function planSheet(opts={}){
  const p=opts.id?S.plan.find(x=>x.id===opts.id):{date:opts.date||addDays(today(),new Date().getHours()>=17?1:0),recipeId:opts.recipeId||S.recipes[0]?.id,servings:null,meal:'večeře'};
  if(!S.recipes.length){openSheet('Naplánovat jídlo','<div class="empty">Nejdřív si ulož aspoň jeden recept.</div>',`<button class="btn pri" data-act="recipe-edit">+ Nový recept</button>`);return}
  const r0=recipe(p.recipeId)||S.recipes[0];
  openSheet(opts.id?'Upravit plán':'Naplánovat jídlo',`<label class="f">Recept<select id="pl-r">${[...S.recipes].sort((a,b)=>a.name.localeCompare(b.name,'cs')).map(r=>`<option value="${h(r.id)}" ${r.id===r0.id?'selected':''}>${h(r.name)}</option>`).join('')}</select></label>
  <div class="fgrid"><label class="f">Den<input type="date" id="pl-d" value="${p.date}"></label><label class="f">Jídlo<select id="pl-m">${['snídaně','oběd','večeře','meal prep'].map(m=>`<option ${m===p.meal?'selected':''}>${m}</option>`).join('')}</select></label><label class="f">Porcí<input type="number" id="pl-s" min="1" step="1" value="${p.servings||r0.servings}"></label></div>
  <div id="pl-prev"></div>`,`${opts.id?`<button class="btn danger ghost" data-act="plan-del" data-id="${h(opts.id)}">Odebrat</button><span style="flex:1"></span>`:''}<button class="btn" data-act="close">Zrušit</button><button class="btn pri" id="pl-ok">Uložit</button>`,()=>{
    const upd=(resetS)=>{const r=recipe($('#pl-r').value);if(resetS)$('#pl-s').value=r.servings;const a=recipeAvail(r,+$('#pl-s').value||r.servings);$('#pl-prev').innerHTML=`<h3 style="margin-bottom:6px">Suroviny na ${+$('#pl-s').value} ${plural(+$('#pl-s').value,'porci','porce','porcí')}</h3><ul class="ings">${a.rows.map(g=>`<li><span class="q">${qtyTxt(g.need,g.unit)}</span><span>${h(g.name)}</span><span class="st ${g.st}">${g.st==='have'?'✓ doma':g.st==='part'?'máš '+fmtQty(g.have,g.unit):g.st==='taste'?'':'chybí'}</span></li>`).join('')}</ul>`};
    $('#pl-r').addEventListener('change',()=>upd(true));$('#pl-s').addEventListener('input',()=>upd(false));upd(false);
    $('#pl-ok').onclick=async()=>{const data={...(opts.id?p:{}),recipeId:$('#pl-r').value,date:$('#pl-d').value||today(),meal:$('#pl-m').value,servings:Math.max(1,+$('#pl-s').value||1),cooked:!!p.cooked,example:false};closeSheet();await put('plan',data);toast('Naplánováno na '+fmtDate(data.date))};
  });
}
function cookPlan(r,servings){
  const f=servings/(r.servings||1);const avail=S.items.map(it=>({it,left:it.qty}));
  return(r.ingredients||[]).filter(g=>g.qty!=null).map(g=>{const need=g.qty*f;const cands=avail.filter(a=>a.left>1e-9&&matches(a.it.name,g.name)&&conv(1,a.it.unit,g.unit,a.it.name)!=null).sort((a,b)=>((a.it.loc==='mrazak')-(b.it.loc==='mrazak'))||((b.it.opened?1:0)-(a.it.opened?1:0))||(expiry(a.it)<expiry(b.it)?-1:1));
    let rem=need;const picks=[];for(const a of cands){if(rem<=1e-9)break;const leftIng=conv(a.left,a.it.unit,g.unit,a.it.name);const t=Math.min(rem,leftIng);const ti=Math.round(conv(t,g.unit,a.it.unit,a.it.name)*100)/100;picks.push({id:a.it.id,take:ti});a.left-=ti;rem-=t}
    return{name:g.name,need,unit:g.unit,picks,short:Math.max(0,rem)}});
}
function cookSheet(pid){
  const p=S.plan.find(x=>x.id===pid);const r=p&&recipe(p.recipeId);if(!r)return;
  const rows=cookPlan(r,p.servings);
  openSheet('Uvařeno: '+r.name,`<div class="note">Odečtu suroviny ze zásob — nejdřív otevřené a ty s nejkratší trvanlivostí. Množství můžeš upravit, třeba když jsi dal míň.</div>
  <div>${rows.map((x,i)=>`<div class="drow"><span><b>${h(x.name)}</b></span><span class="mono">${fmtQty(x.need,x.unit)}</span><div class="from">${x.picks.length?x.picks.map((pk,j)=>{const it=S.items.find(y=>y.id===pk.id);return`<span>z „${h(it.name)}“ (${LOCS[it.loc].toLowerCase()}, máš ${fmtQty(it.qty,it.unit)}):</span><input type="number" step="any" min="0" value="${pk.take}" data-pick="${i}-${j}" aria-label="Odečíst z ${h(it.name)}"><span>${it.unit}</span>`}).join('<span style="flex-basis:100%"></span>'):''}${x.short>1e-6?`<span style="color:var(--bad)">chybí ${fmtQty(x.short,x.unit)} — tuhle část nemám odkud odečíst</span>`:''}</div></div>`).join('')}</div>
  <label class="f" style="max-width:220px">Zbyde hotových porcí<input type="number" id="ck-l" min="0" step="1" value="0"></label><div class="note">Zbytek uložím do lednice jako „${h(r.name)}“ s trvanlivostí 3 dny.</div>`,`<button class="btn" data-act="close">Zrušit</button><button class="btn pri" id="ck-ok">Odečíst a označit jako uvařené</button>`,()=>{
    $('#ck-ok').onclick=async()=>{const takes={};document.querySelectorAll('[data-pick]').forEach(inp=>{const[i,j]=inp.dataset.pick.split('-').map(Number);const pk=rows[i].picks[j];takes[pk.id]=(takes[pk.id]||0)+(+inp.value||0)});
      const left=+$('#ck-l').value||0;closeSheet();const opened=[];
      for(const[id,t]of Object.entries(takes)){const it=S.items.find(x=>x.id===id);if(!it||t<=0)continue;const res=await applyTake(it,t);if(res)opened.push(`${it.name} (${fmtQty(res.qty,it.unit)}, do ${fmtDate(res.until)})`)}
      if(left>0)await put('items',{...newItem({name:r.name,qty:left,unit:'porce',loc:'lednice',days:3,openDays:null}),cat:'Hotové jídlo',guess:false});
      const{id:_,...rest}=p;await put('plan',{...rest,id:pid,cooked:true});
      toast(opened.length?`Hotovo. Načaté zbytky: ${opened.join(', ')} — najdeš je ve „Spotřebuj nejdřív“.`:'Hotovo, zásoby jsou aktualizované.')};
  });
}

/* shopping */
async function genShop(){
  const t=today(),end=addDays(t,S.horizon-1);const need={};
  S.plan.filter(p=>!p.cooked&&p.date>=t&&p.date<=end).sort((a,b)=>a.date<b.date?-1:1).forEach(p=>{const r=recipe(p.recipeId);if(!r)return;const f=p.servings/(r.servings||1);(r.ingredients||[]).forEach(g=>{if(g.qty==null)return;const k=ingKey(g.name)+'|'+g.unit;need[k]=need[k]||{name:g.name,unit:g.unit,qty:0,why:[]};need[k].qty+=g.qty*f;const w=r.name+' ('+fmtDate(p.date)+')';if(!need[k].why.includes(w))need[k].why.push(w)})});
  const missing=[];for(const n of Object.values(need)){const have=haveFor(n.name,n.unit);let m=n.qty-have;if(m<=1e-6)continue;m=n.unit==='ks'||n.unit==='porce'?Math.ceil(m-1e-6):Math.ceil(m/10)*10;missing.push({name:n.name,qty:m,unit:n.unit,reason:n.why.join(', ')})}
  for(const s of S.shop.filter(s=>s.auto&&!s.checked))await del('shop',s.id);
  const manual=S.shop.filter(s=>!s.auto&&!s.checked);let added=0;
  for(const m of missing){if(manual.some(s=>matches(s.name,m.name)))continue;await put('shop',{...m,checked:false,auto:true,createdAt:new Date().toISOString()});added++}
  toast(Object.keys(need).length?(added?`Do seznamu přibylo ${added} ${plural(added,'položka','položky','položek')} podle plánu na ${S.horizon} dní.`:'Na naplánovaná jídla máš všechno doma.'):'V jídelníčku na tohle období nic není.');
}
function shopText(){const l=S.shop.filter(s=>!s.checked);return'Nákup – '+fmtDate(today())+'\n'+l.map(s=>'☐ '+s.name+(s.qty?' – '+fmtQty(s.qty,s.unit):'')).join('\n')}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==='shop-check')return;
  switch(a){
    case'tab':S.tab=b.dataset.v;try{localStorage.setItem('sp-tab',S.tab)}catch(_){}closeSheet();render();window.scrollTo(0,0);break;
    case'loc':S.loc=b.dataset.v;try{localStorage.setItem('sp-loc',S.loc)}catch(_){}render();break;
    case'close':closeSheet();break;
    case'item':itemSheet(id);break;
    case'consume':consumeSheet(id);break;
    case'open':{const it=S.items.find(x=>x.id===id);closeSheet();await patch('items',id,openPatch(it));toast(`${it.name}: otevřeno, spotřebuj do ${fmtDate(expiry({...it,...openPatch(it)}))}`);break}
    case'packs':packsSheet(id);break;
    case'pk-take':consumeSheet(id,+b.dataset.i);break;
    case'pk-thaw':thaw(id,+b.dataset.i);break;
    case'pk-open':{const it=S.items.find(x=>x.id===id);const ps=getPacks(it).map(p=>({...p}));const i=+b.dataset.i;ps[i].opened=true;ps[i].openedAt=today();closeSheet();await savePacks(it,ps);const od=it.openDays??kbFind(it.name)?.open??3;toast(`Otevřeno balení ${fmtQty(ps[i].q,it.unit)}, spotřebuj do ${fmtDate(addDays(today(),od))}`);break}
    case'portion':portionSheet(id);break;
    case'thaw':thaw(id);break;
    case'item-edit':itemEditSheet(id);break;
    case'date-ok':await patch('items',id,{guess:false});b.remove();toast('Datum označeno jako přesné');break;
    case'merge':mergeSheet(id,b.dataset.other);break;
    case'item-del':if(b.dataset.armed){closeSheet();await del('items',id);toast('Smazáno')}else{b.dataset.armed='1';const l=b.querySelector('.al b');if(l){l.textContent='Klepni znovu pro smazání';b.querySelector('.al').insertAdjacentHTML('beforeend','<small>položka zmizí ze zásob</small>')}else b.textContent='Klepni znovu pro smazání'}break;
    case'add-open':addSheet();break;
    case'settings':settingsSheet();break;
    case'catf':S.cat=b.dataset.v;try{localStorage.setItem('sp-cat',S.cat)}catch(_){}render();break;
    case'sort':S.sort={...(S.sort||{}),[b.dataset.k]:b.dataset.v};try{localStorage.setItem('sp-sort',JSON.stringify(S.sort))}catch(_){}render();break;
    case'add-named':{const nm=qOf('zasoby');addTab='manual';addSheet();const inp=$('#e-n');if(inp){inp.value=cap(nm.trim());inp.dispatchEvent(new Event('input',{bubbles:true}))}break}
    case'export':exportBackup();break;
    case'import-open':importSheet();break;
    case'shop-share':try{await navigator.share({title:'Nákup',text:shopText()})}catch(_){}break;
    case'del-examples':if(b.dataset.armed){for(const c of COLS)for(const x of S[c].filter(x=>x.example))await del(c,x.id);toast('Ukázková data smazána')}else{b.dataset.armed='1';b.textContent='Opravdu smazat všechny ukázky?'}break;
    case'recipe-edit':recipeEditSheet(id);break;
    case'recipe-import':openSheet('Importovat recepty','<div id="imp-body"></div>','',()=>mountImport($('#imp-body')));break;
    case'recipe-view':recipeView(id);break;
    case'plan-new':planSheet({recipeId:b.dataset.r,date:b.dataset.d});break;
    case'plan-edit':planSheet({id});break;
    case'plan-del':closeSheet();await del('plan',id);toast('Odebráno z plánu');break;
    case'cook':cookSheet(id);break;
    case'shop-gen':b.disabled=true;await genShop();b.disabled=false;break;
    case'shop-del':await del('shop',id);break;
    case'shop-clear':for(const s of S.shop.filter(s=>s.checked))await del('shop',s.id);break;
    case'shop-copy':{const t=shopText();try{await navigator.clipboard.writeText(t);toast('Zkopírováno — vlož do zpráv nebo poznámek v telefonu.')}catch(_){openSheet('Seznam jako text','<textarea id="cp" readonly style="min-height:240px"></textarea><div class="note">Označ text a zkopíruj ho.</div>','',()=>{$('#cp').value=t;$('#cp').select()})}break}
    case'shop-stock':{const ch=S.shop.filter(s=>s.checked);reviewSheet(ch.map(s=>newItem({name:s.name,qty:s.qty||1,unit:s.unit||'ks'})),ch.map(s=>s.id));break}
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;if(t.dataset.act==='shop-check'){await patch('shop',t.dataset.id,{checked:t.checked})}
  if(t.id==='horizon'){S.horizon=+t.value}
  if(t.id==='src-f'){S.src=t.value;render()}
});
document.addEventListener('submit',async e=>{if(e.target.id!=='shop-add')return;e.preventDefault();const v=$('#shop-new').value;const p=parseLine(v);if(!p)return;const hasQty=/\d/.test(v);await put('shop',{name:p.name,qty:hasQty?p.qty:null,unit:hasQty?p.unit:null,checked:false,auto:false,reason:'',createdAt:new Date().toISOString()});const inp=$('#shop-new');if(inp){inp.value='';inp.focus()}});
document.addEventListener('input',e=>{const k=e.target&&e.target.dataset&&e.target.dataset.q;if(k){S.q={...(S.q||{}),[k]:e.target.value};render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(e.target&&e.target.dataset&&e.target.dataset.q&&!$('#ov')){S.q={...(S.q||{}),[e.target.dataset.q]:''};render();return}closeSheet()}});
boot();
</script>
</body>
